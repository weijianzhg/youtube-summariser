# LLM Configuration
# Supported providers: "openai", "anthropic", "openrouter", or "local"
provider: "anthropic"

# Model settings per provider
openai:
  model: "gpt-5.2"
  max_tokens: 3000

anthropic:
  model: "claude-sonnet-4-5-20250929"
  max_tokens: 3000

# OpenRouter provides access to 300+ models via a unified API
# Model format: "provider/model-name" (e.g., "anthropic/claude-sonnet-4.5")
openrouter:
  model: "anthropic/claude-sonnet-4.5"
  max_tokens: 3000

# Local GGUF/llama.cpp or Hugging Face/Transformers model settings.
# model_path may be a Hugging Face repo ID, a .gguf file, an extracted model directory,
# or a .tar/.tar.gz archive. GGUF repos can set model_file or use repo:filename.
# The default public fine-tune is weijianzhg/youtube-summariser-qwen3.5-4b-GGUF Q4_K_M.
local:
  model_path: ""
  model_file: ""
  max_tokens: 512
  map_max_tokens: 180
  intermediate_max_tokens: 180
  final_max_tokens: 1200
  max_input_tokens: 8192
  n_ctx: 9600
  cache_dir: "~/.cache/youtube-summariser/models"
  device: "auto"
  torch_dtype: "auto"
