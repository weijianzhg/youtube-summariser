# LLM Configuration
# Supported providers: "openai", "anthropic", "openrouter", or "local"
provider: "anthropic"

# Model settings per provider
openai:
  model: "gpt-5.2"
  max_tokens: 3000

anthropic:
  model: "claude-sonnet-4-5-20250929"
  max_tokens: 3000

# OpenRouter provides access to 300+ models via a unified API
# Model format: "provider/model-name" (e.g., "anthropic/claude-sonnet-4.5")
openrouter:
  model: "anthropic/claude-sonnet-4.5"
  max_tokens: 3000

# Local Hugging Face/Transformers model settings.
# model_path may point to an extracted model directory or a .tar/.tar.gz archive.
local:
  model_path: ""
  max_tokens: 512
  max_input_tokens: 1536
  cache_dir: "~/.cache/youtube-summariser/models"
  device: "auto"
  torch_dtype: "auto"
